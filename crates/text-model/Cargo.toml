[package]
name = "text-model"
description = "Shared TextModel port (a local mirror of the unpublished harness port) and its FakeTextModel double"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `FakeTextModel` (src/testing.rs) is off by default so the Worker build
# never carries it; module crates turn it on from their dev-dependencies.
testing = []

[dependencies]
# `scrub_text` for the sanitized error `Display`s.
cratefield-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
