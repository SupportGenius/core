[package]
name = "module-escalation"
description = "SupportGenius escalation module: a conversation becomes a ticket - drafted, judged, filed, followed up"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The module-local doubles (src/testing.rs: `FakeConfig` and
# `SettableClock`; the `TextModel`/`Tracker` doubles come from
# `cratefield_testing`) are off by default so the Worker build never
# carries them; integration tests turn the feature on through the self
# dev-dependency below.
testing = []

[dependencies]
# The ports (`TextModel`/`Tracker` included), the store
# (`Database`/`Statement`/`Outbox`/`Clock`/`IdGen`), and `scrub_text` for
# the error `Display`s.
cratefield-core = { workspace = true }
# `Module::router` returns an `axum::Router`; this module returns it
# deliberately empty (see `Escalation::router` in lib.rs), so the
# dependency exists for the trait's return type alone. Same pin and
# feature set cratefield-core uses, so nothing new enters the graph.
axum = { version = "0.8.9", default-features = false }
async-trait = { workspace = true }
# The shared tokenizer and BM25 ranker: the judge stage scores the
# ticket's draft against already-filed candidate tickets so the model is
# shown the plausible duplicates, not asked to recall them from nothing.
lexical = { path = "../lexical" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The store renders its queries through the same sea-query pin core uses
# (`Statement::render` builds with the SQLite query builder).
sea-query = { version = "0.32.7", default-features = false, features = [
    "backend-sqlite",
    "thread-safe",
] }
# Intake stamps rows with the `Clock` port's `OffsetDateTime`, formatted
# RFC 3339. Both versions match what cratefield-core already pulls in, so
# nothing new enters the graph.
time = { version = "0.3.45", default-features = false, features = [
    "std",
    "formatting",
] }

[dev-dependencies]
# A crate may depend on itself for tests: this copy enables the `testing`
# feature, so `tests/*.rs` can `use module_escalation::testing::..` while
# the plain lib (the one the venture links) stays feature-free.
module-escalation = { path = ".", features = ["testing"] }
pollster = { workspace = true }
# The store and intake round-trip tests run against a real in-memory
# SQLite through the shipped migration. Already in the lock through
# cratefield-testing; this only names the edge.
cratefield-adapter-sqlite = { workspace = true }
# The pipeline acceptance tests drive the stages through the published
# doubles: `FakeTextModel`/`FakeTracker` script the two ports this module
# consumes, `FakeDefer` runs the next stage the moment a stage enqueues
# it (the path the issue names), and `FakeMailer` is the wired-mailer
# side of the notify stage's `no_recipient` pin.
cratefield-testing = { workspace = true }
