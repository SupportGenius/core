[package]
name = "module-support"
description = "SupportGenius module: support conversations answered with model answers that must cite what was retrieved"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

# Target-gated, so host builds are untouched. getrandom is reached through
# cratefield-core -> ulid -> rand and needs the opt-in wasm_js backend on
# wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
# Dev-only, so it never reaches a venture's wasm graph.
cratefield-testing = { workspace = true }
pollster = { workspace = true }
# `ServiceExt::oneshot` drives the router in tests, as in the reference
# module's route tests. Version matches the tower the graph already
# resolves through axum.
tower = { version = "0.5.3", features = ["util"] }
