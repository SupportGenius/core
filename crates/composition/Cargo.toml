[package]
name = "supportgenius-composition"
description = "SupportGenius's venture identity and module list, written down exactly once for both link targets"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-module-waitlist = { workspace = true }
# The venture's mail theme (`MailTheme::from_json` over the committed
# `src/mail-theme.json`) and the waitlist templates rendered in it.
cratefield-mail-templates = { workspace = true }
module-support = { path = "../module-support" }
# Both modules register here, and this crate adapts escalation to support's
# handoff port (see `EscalationHandoff`). Not a dependency of either module
# on the other: only the composition, which already owns the module list,
# knows both.
module-escalation = { path = "../module-escalation" }
# The Living Brain client both module ports adapt to (issue #64). The one
# vendor-aware crate: the modules see only their own traits, and this is
# where those traits meet the service's wire contract.
adapter-livingbrain = { path = "../adapter-livingbrain" }
# `UnconfiguredTextModel`/`UnconfiguredTracker` implement the async ports
# the escalation module requires; the attribute must match the one on the
# traits in `cratefield-core`.
async-trait = { workspace = true }
# The vendored Factory Zero stack registry entry (`src/built-with.json`),
# parsed at runtime by `built_with` so the About/Settings section renders
# without a fetch and the mail footer's Owlpost line can be decided from
# the registry rather than hardcoded. No `preserve_order`: `built_with`
# assembles its payload key order itself, so it does not depend on which
# map this build resolved.
serde_json = { workspace = true }

[dev-dependencies]
# The composition's acceptance tests drive a real harness over the
# published doubles, post a handoff through the support route and drain
# the deferred escalation run.
cratefield-testing = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }
pollster = { workspace = true }
axum = { version = "0.8.9", default-features = false }
http = { workspace = true }
bytes = { workspace = true }
# `ServiceExt::oneshot` drives the router without a network; pinned to
# the same line cratefield-testing builds against so one tower compiles.
tower = { version = "0.5.3", features = ["util"] }
# `serde_json` is a runtime dependency above (the vendored stack entry),
# so the acceptance tests that build request bodies with `json!` get it
# from there rather than declaring it twice.
# `tests/mail.rs` snapshots both waitlist mails rendered in the venture's
# theme; the same 1.x line the upstream waitlist snapshots its own with.
insta = "1.48.0"
