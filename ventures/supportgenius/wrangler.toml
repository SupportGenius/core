name = "supportgenius"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "worker-build --release"

[observability]
enabled = true

# The environment is declared here, not hardcoded into the composition:
# `HarnessBuilder::build` takes no config, so a hardcoded
# `VentureEnv::Production` would make the composition refuse to build
# instead of serving (see src/lib.rs).
[vars]
ENV = "production"
# Per-tier model ids for the `TextModel` port (issue #22), read by
# `build_text_model` in src/lib.rs. Overridable; these are the defaults
# the code falls back to when a var is absent — spelled out here so an
# operator sees the knobs next to the secret that turns the port on.
SUPPORTGENIUS_MODEL_FAST = "claude-haiku-4-5"
SUPPORTGENIUS_MODEL_STRONG = "claude-sonnet-5"

# Secrets a human must set before this Worker can do its job
# (`wrangler secret put <NAME>`):
#
#   HARNESS_SECRET   required, >= 32 bytes. Backs the harness `Signer`
#                    port and log pseudonyms; without it the runtime logs
#                    "HARNESS_SECRET missing or invalid" and leaves the
#                    Signer unset.
#   RESEND_API_KEY   required. The Resend key for the sending subdomain
#                    `send.supportgeni.us`. Without it the mailer answers
#                    `NotConfigured` and every join fails loudly (by
#                    design; there is no no-op mailer here).
#   TURNSTILE_SECRET required for production traffic. The Turnstile widget
#                    secret paired with the sitekey on the site's form.
#                    Without it no Captcha port is mounted; because ENV is
#                    `production` below, the harness production-readiness
#                    gate then answers 503 to every `/v1/*` request (and the
#                    join fails closed) until it is set — so it is
#                    effectively required in production, not silently
#                    optional. In a non-production ENV joins skip human
#                    verification.
#   ADMIN_TOKEN      optional. Gates `GET /v1/waitlist/admin/export.csv`
#                    (Bearer auth, constant-time compared). Without it the
#                    export answers 401.
#   ANTHROPIC_API_KEY optional. Mounts the `TextModel` port (issue #22):
#                    one Anthropic adapter per tier behind a
#                    `RoutingTextModel`, model ids from the
#                    SUPPORTGENIUS_MODEL_* vars above. Without it no port
#                    is mounted, `POST /v1/support/messages` answers
#                    `503 text-model-not-configured`, and `/__ready`
#                    reports `"text_model":"missing"`.

# The Workers Rate Limiting binding backing the harness `RateLimiter`
# port, mounted unconditionally in src/lib.rs so the public
# `POST /v1/waitlist` mail send (issue #16) and the authenticated
# `/v1/support/{search,sources}` full-corpus fetch (issue #17) always have
# a volume ceiling — there is no optional secret to forget. `namespace_id`
# is any integer unique among this account's rate-limit namespaces;
# `period` must be 10 or 60 (seconds); `limit` is requests per period per
# key (the waitlist path keys on IP and email, support on tenant id). Tune
# `limit`/`period` to taste — this is a safety ceiling, not a quota.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# The second Rate Limiting binding the web widget routes (issue #33) run
# on, mounted unconditionally in src/lib.rs like `RATE_LIMITER`: the
# per-visitor and per-client-IP buckets of
# `POST /v1/support/widget/messages` (and the transcript poll) key on
# the visitor token's random id and the edge client IP, namespaced per
# tenant, so one anonymous browser's ceiling never spends a tenant's
# `RATE_LIMITER` budget. A distinct `namespace_id` is what makes the
# buckets independent; if the binding is missing from a deployment the
# widget falls back to the shared `RATE_LIMITER` port. 10/min per
# visitor is deliberately tighter than the tenant budget above — a chat
# turn every few seconds is already faster than a human types.
[[unsafe.bindings]]
name = "VISITOR_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "supportgenius"
# NOT A REAL ID. A human runs `wrangler d1 create supportgenius` and pastes
# the returned UUID here; deploys fail until this is replaced.
database_id = "REPLACE_ME_WITH_THE_UUID_FROM_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

# The R2 bucket backing the harness `Blob` port, mounted unconditionally
# in src/lib.rs (issue #30): the chunked-upload routes
# (`POST /v1/support/uploads` and friends) store document parts here, up
# to 4 MiB per document in 48 KiB parts. The extract job deletes a
# document's parts as soon as it has indexed (or refused) the document;
# the daily cron collects only the uploads abandoned `open` past their
# 24-hour window. A human runs `wrangler r2 bucket create
# supportgenius-uploads` once; deploys fail until the bucket exists.
[[r2_buckets]]
binding = "BLOB"
bucket_name = "supportgenius-uploads"

# The daily cron. This is the half that makes `Module::scheduled` real in
# production: at 04:23 UTC every day the Worker's `#[event(scheduled)]`
# handler (src/lib.rs) fans the event out to each module, and the waitlist
# module purges pending entries past its retention window and prunes
# expired mail-cooldown claims.
[triggers]
crons = ["23 4 * * *"]

[[routes]]
pattern = "api.supportgeni.us"
custom_domain = true
