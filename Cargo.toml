[workspace]
resolver = "3"
# Globs on purpose: later issues add crates and ventures without editing
# this file. Today `crates/*` matches `tenancy` and `composition`, `bin/*`
# the static self-hosted binary, and `ventures/*` only `supportgenius`;
# cargo accepts a glob that currently matches one entry. `evals` is a
# top-level directory no glob covers, so it is listed literally.
members = ["crates/*", "bin/*", "ventures/*", "evals"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/SupportGenius/core"

[workspace.dependencies]
# Every cratefield-* dependency moves together on ONE cratefield-core line
# (0.8): a partial move puts two copies of `cratefield-core` in the graph
# (the modules' `Module` impls are typed against one of them and fail the
# harness builder), which is a compile error, not a warning.
cratefield-core = "0.8"
# Envelope-encrypted per-tenant secrets (issue #23): the escalation
# module stores each tenant's tracker credential through `Secrets`,
# which seals it with a key the KMS wraps. `cratefield-kms` is the port
# the store is built over — the escalation module resolves a provider
# from config (Worker secret or a development key file) and hands it to
# `Secrets::new`. Both are pure Rust and wasm-safe.
cratefield-secrets = "0.4"
cratefield-kms = "0.2"
# Fluent catalogs (the support module's canned clarify/handoff texts) and
# `Accept-Language` parsing for the per-turn language fallback.
cratefield-i18n = "0.2"
cratefield-runtime-cloudflare = "0.4"
cratefield-module-waitlist = "0.4"
# The venture's own mail theme (`MailTheme`) and the module templates
# rendered in it (issue #12): the composition reads
# `crates/composition/src/mail-theme.json` and registers the waitlist's
# themed templates, so the confirmation mail wears supportgeni.us's tokens
# rather than the module's neutral default.
cratefield-mail-templates = "0.1"
cratefield-adapter-resend = "0.4"
# The second `Mailer` the venture prefers when its key is set (Owlpost
# over Resend): wasm-safe, one shape per link target, no key -> a keyless
# adapter that answers `NotConfigured` without a network call.
cratefield-adapter-owlpost = "0.2"
cratefield-adapter-turnstile = "0.3"
# The two `Tracker` adapters `module-escalation` files into, and the
# outbound-webhook module it publishes its escalation events through.
# Feature-gated in `module-escalation` (`tracker-github`/`tracker-webhook`,
# both on by default); on the same core 0.8 line as the rest of the set.
cratefield-adapter-github-issues = "0.3"
cratefield-adapter-webhook-tracker = "0.3"
cratefield-module-webhooks = "0.3"
# The Anthropic `TextModel` adapter (issue #22): wasm-safe, because it
# runs over the `HttpClient` port rather than reqwest — the same adapter
# serves the Worker and the static binary, one instance per tier. It is
# also the `evals` runner's real-model option (`--model anthropic[:ID]`).
cratefield-adapter-anthropic = "0.3"
cratefield-testing = "0.5"
cratefield-cli = "0.5"
# Native-only (tokio/reqwest/redis do not compile to wasm): consumed only
# by `bin/supportgenius`, whose native deps are target-gated so the wasm
# graph stays clean.
cratefield-runtime-native = "0.4"
# rusqlite with the `bundled` feature: the static musl binary compiles
# SQLite in, no system lib and no dynamic linking.
cratefield-adapter-sqlite = "0.3"
# Postgres is the operator's opt-in (`--features postgres`), not the
# default: SQLite is what makes the binary run with zero configuration.
cratefield-adapter-postgres = "0.3"
# The `http` feature stays off: with it enabled, D1 writes hang under
# workerd/miniflare (upstream, worker 0.8.5, verified empirically).
worker = { version = "0.8", default-features = false, features = ["d1"] }
async-trait = "0.1.92"
# Enabled by wasm leaf crates: getrandom (reached through the runtime)
# needs the opt-in wasm_js backend on wasm32-unknown-unknown.
getrandom = { version = "0.4.3", default-features = false, features = [
    "wasm_js",
] }
http = "1.5.0"
pollster = { version = "0.4", features = ["macro"] }
# Pure Rust and wasm32-safe: content-addressed chunk ids in module-support.
sha2 = "0.11"
# The delivery signature `module-webhooks` and
# `cratefield-adapter-webhook-tracker` sign with (HMAC-SHA256 over
# `{unix}.{body}`). On the 0.13/digest-0.11 stack beside `sha2` above, so
# no second digest stack enters the graph; named here so the escalation
# tests can recompute a signature independently of the code that made it.
hmac = "0.13.0"
# Feature set matched to what runtime-native itself uses, so the binary
# enables exactly what it needs (`macros`, `rt-multi-thread`) on top.
tokio = { version = "1.53", default-features = false }
tracing = "0.1.44"
bytes = "1.12"
# Types the module crates serialise, wrap and classify directly.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `JsonSchema` on the request bodies module-support deserializes (issue
# #34): the MCP tool input schemas and the OpenAPI paths are generated
# from the very types the handlers read, so the two cannot drift. Same
# 1.2 line cratefield-core already uses, so one `schemars` is in the
# graph and the `derive` feature is additive to core's `preserve_order`.
schemars = { version = "1.2", features = ["derive"] }
thiserror = "2.0.20"
# Pure Rust and wasm32-safe: script/trigram language detection for the
# support module's per-turn `lang`.
whatlang = "0.18.0"

[workspace.lints.rust]
unsafe_code = "forbid"
# A `pub` item in a private module can be named by nobody: it reads as API
# and is not one.
unreachable_pub = "warn"
# A type reachable through a public API but not nameable by the caller.
unnameable_types = "warn"
# A cast that does nothing. Zero today; it is here so the first one is
# caught rather than read past.
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Builder-heavy API: nearly every `fn(self) -> Self` and getter trips this
# lint; the attribute noise outweighs the value.
must_use_candidate = { level = "allow", priority = 1 }
