[workspace]
resolver = "3"
# Globs on purpose: later issues add crates and ventures without editing
# this file. Today `crates/*` matches `tenancy` and `composition`, `bin/*`
# the static self-hosted binary, and `ventures/*` only `supportgenius`;
# cargo accepts a glob that currently matches one entry.
members = ["crates/*", "bin/*", "ventures/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/SupportGenius/core"

[workspace.dependencies]
# Every cratefield-* dependency is pinned to ONE harness git rev, never
# split between crates.io and git: mixing sources puts two copies of
# `cratefield-core` in the graph (the modules' `Module` impls are typed
# against one of them and fail the harness builder), which is a compile
# error, not a warning.
#
# The rev is b50c1d9, harness main on 2026-09-28, because that is where
# core 0.5.0 publishes the `TextModel`/`Tracker` ports and
# cratefield-testing the matching `FakeTextModel`/`FakeTracker` doubles —
# the two ports this workspace's support and escalation modules are
# written against, which were mirrored locally until now. No crates.io
# release carries them (the latest companions still require core ^0.4),
# so a crates.io pin cannot express this graph at all.
# Return the whole set to crates.io — core "0.6" and its companions —
# once Cratefield/harness#558 is published and its crates-io-resolve job
# is green.
cratefield-core = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
# Fluent catalogs (the support module's canned clarify/handoff texts) and
# `Accept-Language` parsing for the per-turn language fallback.
cratefield-i18n = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
cratefield-runtime-cloudflare = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
cratefield-module-waitlist = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
cratefield-adapter-resend = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
cratefield-adapter-turnstile = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
# The Anthropic `TextModel` adapter (issue #22): wasm-safe, because it
# runs over the `HttpClient` port rather than reqwest — the same adapter
# serves the Worker and the static binary, one instance per tier.
cratefield-adapter-anthropic = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
cratefield-testing = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
cratefield-cli = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
# Native-only (tokio/reqwest/redis do not compile to wasm): consumed only
# by `bin/supportgenius`, whose native deps are target-gated so the wasm
# graph stays clean.
cratefield-runtime-native = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
# rusqlite with the `bundled` feature: the static musl binary compiles
# SQLite in, no system lib and no dynamic linking.
cratefield-adapter-sqlite = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
# Postgres is the operator's opt-in (`--features postgres`), not the
# default: SQLite is what makes the binary run with zero configuration.
cratefield-adapter-postgres = { git = "https://github.com/Cratefield/harness", rev = "b50c1d99b6f29e11a9fd5f116a8cd31275f735c6" }
# The `http` feature stays off: with it enabled, D1 writes hang under
# workerd/miniflare (upstream, worker 0.8.5, verified empirically).
worker = { version = "0.8", default-features = false, features = ["d1"] }
async-trait = "0.1.92"
# Enabled by wasm leaf crates: getrandom (reached through the runtime)
# needs the opt-in wasm_js backend on wasm32-unknown-unknown.
getrandom = { version = "0.4.3", default-features = false, features = [
    "wasm_js",
] }
http = "1.5.0"
pollster = { version = "0.4", features = ["macro"] }
# Pure Rust and wasm32-safe: content-addressed chunk ids in module-support.
sha2 = "0.11"
# Feature set matched to what runtime-native itself uses, so the binary
# enables exactly what it needs (`macros`, `rt-multi-thread`) on top.
tokio = { version = "1.53", default-features = false }
tracing = "0.1.44"
bytes = "1.12"
# Types the module crates serialise, wrap and classify directly.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
# Pure Rust and wasm32-safe: script/trigram language detection for the
# support module's per-turn `lang`.
whatlang = "0.18.0"

[workspace.lints.rust]
unsafe_code = "forbid"
# A `pub` item in a private module can be named by nobody: it reads as API
# and is not one.
unreachable_pub = "warn"
# A type reachable through a public API but not nameable by the caller.
unnameable_types = "warn"
# A cast that does nothing. Zero today; it is here so the first one is
# caught rather than read past.
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Builder-heavy API: nearly every `fn(self) -> Self` and getter trips this
# lint; the attribute noise outweighs the value.
must_use_candidate = { level = "allow", priority = 1 }
