[workspace]
resolver = "3"
# Globs on purpose: later issues add crates and ventures without editing
# this file. Today `crates/*` matches `tenancy` and `composition`, `bin/*`
# the static self-hosted binary, and `ventures/*` only `supportgenius`;
# cargo accepts a glob that currently matches one entry.
members = ["crates/*", "bin/*", "ventures/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/SupportGenius/core"

[workspace.dependencies]
# cratefield-core is pinned to the 0.4 line deliberately, NOT 0.5: every
# published companion crate this workspace needs —
# cratefield-runtime-cloudflare 0.1.4, cratefield-module-waitlist 0.1.4,
# cratefield-adapter-resend 0.2.2, cratefield-adapter-turnstile 0.1.4,
# cratefield-testing 0.2.2 and cratefield-cli 0.2.2 — still requires
# core ^0.4. Asking for core 0.5 puts two copies of core in the graph
# and the waitlist module's `Module` impl (typed against core 0.4) no
# longer satisfies the harness builder, which is a compile error, not a
# deprecation. The 0.4.3 -> 0.5.0 API delta is confined to
# `TenantStatus`, so nothing else in this workspace is affected; revisit
# the pin when the companions publish against 0.5.
cratefield-core = "0.4"
cratefield-runtime-cloudflare = "0.1"
cratefield-module-waitlist = "0.1"
cratefield-adapter-resend = "0.2"
# 0.1.4 is the turnstile adapter line built against core ^0.4.
cratefield-adapter-turnstile = "0.1"
cratefield-testing = "0.2"
cratefield-cli = "0.2"
# Native-only (tokio/reqwest/redis do not compile to wasm): consumed only
# by `bin/supportgenius`, whose native deps are target-gated so the wasm
# graph stays clean.
cratefield-runtime-native = "0.1"
# rusqlite with the `bundled` feature: the static musl binary compiles
# SQLite in, no system lib and no dynamic linking.
cratefield-adapter-sqlite = "0.1"
# Postgres is the operator's opt-in (`--features postgres`), not the
# default: SQLite is what makes the binary run with zero configuration.
cratefield-adapter-postgres = "0.1"
# The `http` feature stays off: with it enabled, D1 writes hang under
# workerd/miniflare (upstream, worker 0.8.5, verified empirically).
worker = { version = "0.8", default-features = false, features = ["d1"] }
async-trait = "0.1.92"
# Enabled by wasm leaf crates: getrandom (reached through the runtime)
# needs the opt-in wasm_js backend on wasm32-unknown-unknown.
getrandom = { version = "0.4.3", default-features = false, features = [
    "wasm_js",
] }
http = "1.5.0"
pollster = { version = "0.4", features = ["macro"] }
# Pure Rust and wasm32-safe: content-addressed chunk ids in module-support.
sha2 = "0.11"
# Feature set matched to what runtime-native itself uses, so the binary
# enables exactly what it needs (`macros`, `rt-multi-thread`) on top.
tokio = { version = "1.53", default-features = false }
tracing = "0.1.44"
bytes = "1.12"
# The escalation module (issue #4) mirrors the harness `TextModel`/`Tracker`
# ports locally until core publishes them (see
# crates/module-escalation/src/ports/mod.rs); those ports need these four.
# All four already sit in the dependency graph through cratefield-core, so
# this pins what is there rather than adding anything new.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
# A `pub` item in a private module can be named by nobody: it reads as API
# and is not one.
unreachable_pub = "warn"
# A type reachable through a public API but not nameable by the caller.
unnameable_types = "warn"
# A cast that does nothing. Zero today; it is here so the first one is
# caught rather than read past.
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Builder-heavy API: nearly every `fn(self) -> Self` and getter trips this
# lint; the attribute noise outweighs the value.
must_use_candidate = { level = "allow", priority = 1 }
