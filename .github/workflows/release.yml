name: Release

# Tagged releases of the static `bin/supportgenius` binary: build the musl
# binaries (both architectures), smoke each, then attach the tarballs and
# their sha256 checksums to the GitHub release the tag points at — once, in
# `publish`, so the parallel builds cannot race on creating the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          # A native arm64 runner (not a cross toolchain): the C bits
          # rusqlite builds with `cc` and `scripts/smoke.sh` both run
          # natively there.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the static musl binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p supportgenius-bin
      - name: Assert the binary is fully static
        run: |
          ldd target/${{ matrix.target }}/release/supportgenius 2>&1 \
            | grep -q 'statically linked\|not a dynamic executable'
      - name: Smoke the binary before packaging it
        run: scripts/smoke.sh target/${{ matrix.target }}/release/supportgenius
      - name: Package the tarball and checksum
        run: |
          name="supportgenius-${{ matrix.target }}"
          tar czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" supportgenius
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: supportgenius-${{ matrix.target }}
          path: |
            supportgenius-${{ matrix.target }}.tar.gz
            supportgenius-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    # Only this job writes a release; the build jobs stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A manual `workflow_dispatch` has no tag for softprops to release
      # against, so the step is guarded; the uploaded artifacts above still
      # exist on the run.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
