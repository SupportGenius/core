name: Deploy

# Deploy the Worker in `ventures/supportgenius` (issue #40): a push to `main`
# ships **staging** and smokes it; a `v*` tag ships **production**, whose
# required-reviewer approval lives on the `production` GitHub environment — a
# human gates it there. Until `CLOUDFLARE_API_TOKEN` is set, `preflight`
# reports "not configured" and the deploy jobs skip, so `main` stays green.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      # A job-level `if:` cannot read `secrets`, so the token is tested in
      # this step's env instead.
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy (set it with CLOUDFLARE_ACCOUNT_ID to enable)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then env_name=production; else env_name=staging; fi
          # The target environment's D1 id must be real first (runbook step
          # one); refuse the placeholder loudly rather than mid-deploy.
          db_id="$(python3 -c 'import sys, tomllib
          cfg = tomllib.load(open("ventures/supportgenius/wrangler.toml", "rb"))
          env = cfg["env"][sys.argv[1]] if sys.argv[1] != "production" else cfg
          print(env["d1_databases"][0]["database_id"])' "$env_name")"
          if [[ "$db_id" == REPLACE_ME* ]]; then
            echo "::error::$env_name database_id in wrangler.toml is still a placeholder ($db_id); run 'wrangler d1 create' and paste the UUID first."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

  staging:
    name: deploy staging
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    # Serialise per environment; never cancel a deploy mid-flight (a
    # half-applied migration is worse than a queued one).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `wrangler deploy` runs wrangler.toml's `[build] command`
      # (`worker-build --release`), installed here as in ci.yml.
      - name: Install worker-build
        run: cargo install -q --locked worker-build
      - name: Migrate and deploy (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin the CLI: wrangler-action@v3 otherwise defaults to wrangler
          # 3.90.0, which predates this Worker's `compatibility_date`
          # (`wrangler.toml`). Wrangler 4 supports every construct here —
          # `[[unsafe.bindings]]` type `ratelimit`, `custom_domain` routes,
          # `d1 migrations apply` and the `[build]` command.
          wranglerVersion: "4"
          workingDirectory: ventures/supportgenius
          preCommands: d1 migrations apply DB --remote --env staging
          command: deploy --env staging
      - name: Smoke (staging)
        run: |
          base="https://api-staging.supportgeni.us"
          # A custom domain takes a moment to attach; --retry rides that out.
          curl -fsS --retry 20 --retry-delay 6 --retry-all-errors "$base/__health" >/dev/null
          ready="$(curl -fsS "$base/__ready")"
          echo "$ready" | jq -e '.ok == true' >/dev/null || { echo "::error::/__ready not ok: $ready"; exit 1; }

  production:
    name: deploy production
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v') && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # The required-reviewer approval is configured on this environment, so
    # the job waits for a human before it starts.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install worker-build
        run: cargo install -q --locked worker-build
      - name: Migrate and deploy (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Same pin as the staging job, for the same reason.
          wranglerVersion: "4"
          workingDirectory: ventures/supportgenius
          preCommands: d1 migrations apply DB --remote
          command: deploy
      - name: Smoke (production)
        run: |
          base="https://api.supportgeni.us"
          curl -fsS --retry 20 --retry-delay 6 --retry-all-errors "$base/__health" >/dev/null
          ready="$(curl -fsS "$base/__ready")"
          # Production must report the ports that make its public paths safe
          # (issue #40): a configured Captcha and rate limiter, and a mailer.
          echo "$ready" | jq -e '.ok == true and .captcha == "configured" and .rate_limiter == "configured"' >/dev/null \
            || { echo "::error::/__ready missing a required port: $ready"; exit 1; }
          curl -fsS "$base/__health" | jq -e '.mailer == "configured"' >/dev/null \
            || { echo "::error::/__health mailer not configured"; exit 1; }
